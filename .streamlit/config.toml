#
# Tema oscuro REAL de Streamlit. Sin este archivo, el fondo navy que pinta
# app/app.py por CSS convive con el tema CLARO por defecto, que colorea
# párrafos, etiquetas de radio/selectbox, pestañas, expanders y captions con
# su texto casi negro: texto oscuro sobre fondo oscuro en toda la barra
# lateral y en las pestañas. Con el tema declarado acá, Streamlit genera sus
# propios estilos coherentes con el fondo (mismo arreglo que MV Data
# Governance y MV DAX Lab).
[theme]
base = "dark"
primaryColor = "#f2b441"
backgroundColor = "#081527"
secondaryBackgroundColor = "#0c2137"
textColor = "#eaf1fb"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[server]
headless = true
# Escuchar SOLO en la máquina local. Sin esta línea Streamlit se ata a
# 0.0.0.0: la app queda accesible desde toda la red local y la consola imprime
# una "External URL" con la IP pública del que la corre. Para un programa de
# escritorio eso no es una función, es una fuga.
#
# El despliegue en servidor NO se ve afectado: el Dockerfile pasa
# `--server.address=0.0.0.0` en el CMD, y la línea de comandos le gana al
# archivo de configuración. El default es el seguro; abrirse es explícito.
address = "127.0.0.1"
maxUploadSize = 2000
